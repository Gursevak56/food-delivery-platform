openapi: 3.0.3
info:
  title: Rider Delivery Service API
  version: 1.0.0
  description: Premium rider delivery backend for large restaurant operations.
servers:
  - url: http://localhost:8084
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Rider Profile
  - name: Shift
  - name: Dispatch
  - name: Location
  - name: Earnings
  - name: Ratings
  - name: Notifications
  - name: Support
  - name: Admin
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        meta:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error_code:
          type: string
        errors:
          type: object
    LoginRequest:
      type: object
      required: [login, password, device_id, device_name]
      properties:
        login: { type: string }
        password: { type: string }
        device_id: { type: string }
        device_name: { type: string }
    OTPRequest:
      type: object
      required: [login]
      properties:
        login: { type: string }
    OTPVerifyRequest:
      type: object
      required: [login, otp, device_id, device_name]
      properties:
        login: { type: string }
        otp: { type: string }
        device_id: { type: string }
        device_name: { type: string }
    RefreshTokenRequest:
      type: object
      required: [refresh_token, device_id]
      properties:
        refresh_token: { type: string }
        device_id: { type: string }
    UpdateProfileRequest:
      type: object
      required: [first_name, last_name, email, phone]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string }
        phone: { type: string }
    RejectOrderRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    VerifyOrderOTPRequest:
      type: object
      required: [otp]
      properties:
        otp: { type: string }
    LocationUpdateRequest:
      type: object
      required: [latitude, longitude, source]
      properties:
        order_id: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        accuracy_meters: { type: number }
        speed_kph: { type: number }
        heading_degrees: { type: number }
        battery_level: { type: integer }
        source: { type: string }
    RequestPayoutRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number }
    DeviceTokenRequest:
      type: object
      required: [device_id, platform, token]
      properties:
        device_id: { type: string }
        platform: { type: string }
        token: { type: string }
    SupportTicketRequest:
      type: object
      required: [subject, category, priority, description]
      properties:
        subject: { type: string }
        category: { type: string }
        priority: { type: string }
        order_id: { type: string }
        description: { type: string }
    SupportReplyRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AssignRiderRequest:
      type: object
      required: [rider_id]
      properties:
        rider_id: { type: string }
    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string }
paths:
  /v1/auth/rider/login:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Login success, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /v1/auth/rider/otp/send:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OTPRequest' }
      responses:
        '200': { description: OTP sent }
  /v1/auth/rider/otp/verify:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OTPVerifyRequest' }
      responses:
        '200': { description: OTP verified }
  /v1/auth/refresh-token:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200': { description: Token refreshed }
  /v1/auth/logout:
    post:
      tags: [Auth]
      responses:
        '200': { description: Logged out }
  /v1/auth/logout-all:
    post:
      tags: [Auth]
      responses:
        '200': { description: Logged out from all devices }
  /v1/auth/forgot-password:
    post:
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OTPRequest' }
      responses:
        '200': { description: Reset OTP sent }
  /v1/auth/reset-password:
    post:
      tags: [Auth]
      responses:
        '200': { description: Password reset }
  /v1/auth/me:
    get:
      tags: [Auth]
      responses:
        '200': { description: Current user profile }
  /v1/riders/me:
    get:
      tags: [Rider Profile]
      responses:
        '200': { description: Rider profile }
    put:
      tags: [Rider Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200': { description: Rider updated }
  /v1/riders/me/photo:
    put:
      tags: [Rider Profile]
      responses:
        '200': { description: Photo updated }
  /v1/riders/me/vehicle:
    put:
      tags: [Rider Profile]
      responses:
        '200': { description: Vehicle updated }
  /v1/riders/me/documents:
    get:
      tags: [Rider Profile]
      responses:
        '200': { description: Rider documents }
    put:
      tags: [Rider Profile]
      responses:
        '200': { description: Rider documents updated }
  /v1/riders/me/bank-account:
    get:
      tags: [Earnings]
      responses:
        '200': { description: Bank account }
    put:
      tags: [Rider Profile]
      responses:
        '200': { description: Bank account updated }
  /v1/riders/me/status:
    get:
      tags: [Rider Profile]
      responses:
        '200': { description: Rider status }
  /v1/riders/me/go-online:
    post:
      tags: [Shift]
      responses:
        '200': { description: Rider online }
  /v1/riders/me/go-offline:
    post:
      tags: [Shift]
      responses:
        '200': { description: Rider offline }
  /v1/riders/me/break/start:
    post:
      tags: [Shift]
      responses:
        '200': { description: Break started }
  /v1/riders/me/break/end:
    post:
      tags: [Shift]
      responses:
        '200': { description: Break ended }
  /v1/riders/me/shift/start:
    post:
      tags: [Shift]
      responses:
        '200': { description: Shift started }
  /v1/riders/me/shift/end:
    post:
      tags: [Shift]
      responses:
        '200': { description: Shift ended }
  /v1/riders/me/shift/today:
    get:
      tags: [Shift]
      responses:
        '200': { description: Today's shifts }
  /v1/riders/me/shift/history:
    get:
      tags: [Shift]
      responses:
        '200': { description: Shift history }
  /v1/riders/me/order-requests:
    get:
      tags: [Dispatch]
      responses:
        '200': { description: Pending order requests }
  /v1/riders/me/order-requests/{id}:
    get:
      tags: [Dispatch]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Order request detail }
  /v1/riders/me/order-requests/{id}/accept:
    post:
      tags: [Dispatch]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Order accepted }
  /v1/riders/me/order-requests/{id}/reject:
    post:
      tags: [Dispatch]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectOrderRequest' }
      responses:
        '200': { description: Order rejected }
  /v1/riders/me/active-order:
    get:
      tags: [Dispatch]
      responses:
        '200': { description: Active order }
  /v1/riders/me/orders/assigned:
    get:
      tags: [Dispatch]
      responses:
        '200': { description: Assigned orders }
  /v1/riders/me/orders/history:
    get:
      tags: [Dispatch]
      responses:
        '200': { description: Rider order history }
  /v1/riders/me/orders/{orderId}:
    get:
      tags: [Dispatch]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rider order detail }
  /v1/riders/me/orders/{orderId}/arrived-at-restaurant:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: Arrived at restaurant }
  /v1/riders/me/orders/{orderId}/picked-up:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: Picked up }
  /v1/riders/me/orders/{orderId}/start-delivery:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: On the way }
  /v1/riders/me/orders/{orderId}/arrived-at-customer:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: Arrived at customer }
  /v1/riders/me/orders/{orderId}/deliver:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: Delivered }
  /v1/riders/me/orders/{orderId}/failed:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: Delivery failed }
  /v1/riders/me/orders/{orderId}/cancel-request:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: Cancel requested }
  /v1/riders/me/orders/{orderId}/timeline:
    get:
      tags: [Dispatch]
      responses:
        '200': { description: Order timeline }
  /v1/riders/me/orders/{orderId}/verify-pickup-otp:
    post:
      tags: [Dispatch]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOrderOTPRequest' }
      responses:
        '200': { description: Pickup OTP verified }
  /v1/riders/me/orders/{orderId}/verify-delivery-otp:
    post:
      tags: [Dispatch]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOrderOTPRequest' }
      responses:
        '200': { description: Delivery OTP verified }
  /v1/orders/{orderId}/resend-delivery-otp:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: Delivery OTP resent }
  /v1/orders/{orderId}/resend-pickup-otp:
    post:
      tags: [Dispatch]
      responses:
        '200': { description: Pickup OTP resent }
  /v1/riders/me/location/update:
    post:
      tags: [Location]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdateRequest' }
      responses:
        '200': { description: Location updated }
  /v1/riders/me/location/bulk-update:
    post:
      tags: [Location]
      responses:
        '200': { description: Location batch updated }
  /v1/riders/me/location/latest:
    get:
      tags: [Location]
      responses:
        '200': { description: Latest rider location }
  /v1/orders/{orderId}/tracking:
    get:
      tags: [Location]
      responses:
        '200': { description: Order tracking detail }
  /v1/riders/me/routes/{orderId}:
    get:
      tags: [Location]
      responses:
        '200': { description: Route history }
  /v1/riders/me/earnings/today:
    get: { tags: [Earnings], responses: { '200': { description: Today earnings } } }
  /v1/riders/me/earnings/weekly:
    get: { tags: [Earnings], responses: { '200': { description: Weekly earnings } } }
  /v1/riders/me/earnings/monthly:
    get: { tags: [Earnings], responses: { '200': { description: Monthly earnings } } }
  /v1/riders/me/earnings/summary:
    get: { tags: [Earnings], responses: { '200': { description: Earnings summary } } }
  /v1/riders/me/earnings/history:
    get: { tags: [Earnings], responses: { '200': { description: Earnings history } } }
  /v1/riders/me/incentives:
    get: { tags: [Earnings], responses: { '200': { description: Incentives } } }
  /v1/riders/me/bonus-history:
    get: { tags: [Earnings], responses: { '200': { description: Bonus history } } }
  /v1/riders/me/wallet:
    get: { tags: [Earnings], responses: { '200': { description: Wallet } } }
  /v1/riders/me/wallet/transactions:
    get: { tags: [Earnings], responses: { '200': { description: Wallet transactions } } }
  /v1/riders/me/payouts:
    get: { tags: [Earnings], responses: { '200': { description: Payout requests } } }
  /v1/riders/me/payouts/{id}:
    get: { tags: [Earnings], responses: { '200': { description: Payout detail } } }
  /v1/riders/me/payouts/request:
    post:
      tags: [Earnings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPayoutRequest' }
      responses:
        '200': { description: Payout requested }
  /v1/riders/me/ratings/summary:
    get: { tags: [Ratings], responses: { '200': { description: Ratings summary } } }
  /v1/riders/me/reviews:
    get: { tags: [Ratings], responses: { '200': { description: Reviews list } } }
  /v1/riders/me/performance-score:
    get: { tags: [Ratings], responses: { '200': { description: Performance score } } }
  /v1/riders/me/notifications:
    get: { tags: [Notifications], responses: { '200': { description: Notifications list } } }
  /v1/riders/me/notifications/{id}/read:
    put: { tags: [Notifications], responses: { '200': { description: Notification marked read } } }
  /v1/riders/me/notifications/read-all:
    put: { tags: [Notifications], responses: { '200': { description: All notifications marked read } } }
  /v1/riders/me/device-token:
    post:
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceTokenRequest' }
      responses:
        '200': { description: Device token registered }
    delete:
      tags: [Notifications]
      parameters:
        - in: query
          name: device_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Device token removed }
  /v1/riders/me/support-tickets:
    get: { tags: [Support], responses: { '200': { description: Support tickets } } }
    post:
      tags: [Support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportTicketRequest' }
      responses:
        '201': { description: Ticket created }
  /v1/riders/me/support-tickets/{id}:
    get: { tags: [Support], responses: { '200': { description: Support ticket detail } } }
  /v1/riders/me/support-tickets/{id}/reply:
    post:
      tags: [Support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportReplyRequest' }
      responses:
        '200': { description: Support reply created }
  /v1/admin/riders:
    get: { tags: [Admin], responses: { '200': { description: Riders list } } }
    post:
      tags: [Admin]
      responses:
        '201': { description: Rider created }
  /v1/admin/riders/{id}:
    get: { tags: [Admin], responses: { '200': { description: Rider detail } } }
    put:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200': { description: Rider updated }
  /v1/admin/riders/{id}/status:
    put:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStatusRequest' }
      responses:
        '200': { description: Rider status updated }
  /v1/admin/orders/unassigned:
    get: { tags: [Admin], responses: { '200': { description: Unassigned orders } } }
  /v1/admin/orders/{orderId}/assign-rider:
    post:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRiderRequest' }
      responses:
        '200': { description: Rider assigned }
  /v1/admin/orders/{orderId}/reassign-rider:
    post:
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRiderRequest' }
      responses:
        '200': { description: Rider reassigned }
  /v1/admin/orders/live:
    get: { tags: [Admin], responses: { '200': { description: Live orders } } }
  /v1/admin/riders/live-status:
    get: { tags: [Admin], responses: { '200': { description: Live rider statuses } } }
  /v1/admin/analytics/riders:
    get: { tags: [Admin], responses: { '200': { description: Rider analytics } } }
  /v1/admin/config:
    get: { tags: [Admin], responses: { '200': { description: System config } } }
    put: { tags: [Admin], responses: { '200': { description: System config updated } } }
  /v1/admin/payouts:
    get: { tags: [Admin], responses: { '200': { description: Payout review queue } } }
  /v1/admin/payouts/{id}/approve:
    post: { tags: [Admin], responses: { '200': { description: Payout approved } } }
  /v1/admin/payouts/{id}/reject:
    post: { tags: [Admin], responses: { '200': { description: Payout rejected } } }
